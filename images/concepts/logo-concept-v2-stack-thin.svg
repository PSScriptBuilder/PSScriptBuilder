<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Terminal window frame -->
  <rect x="5" y="5" width="246" height="246" rx="14" fill="url(#bg)" stroke="#0D5AA7" stroke-width="5"/>

  <!-- PS> prompt -->
  <text x="22" y="46" font-family="'Consolas','Courier New',monospace" font-size="30"
        fill="#1577C0" opacity="0.9">PS&gt;</text>

  <!-- Source document stack (left) -->
  <!-- Back doc -->
  <rect x="24" y="74" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.22"/>
  <!-- Mid doc -->
  <rect x="34" y="84" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.45"/>
  <!-- Front doc with dog-ear -->
  <polygon points="44,94 104,94 116,106 116,190 44,190" fill="#6E9DBF"/>
  <polygon points="104,94 116,106 104,106" fill="#4E85AB"/>
  <!-- Lines on front doc -->
  <line x1="54" y1="122" x2="106" y2="122" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
  <line x1="54" y1="140" x2="92"  y2="140" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
  <line x1="54" y1="158" x2="100" y2="158" stroke="#0072C6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Output document — dog-ear -->
  <polygon points="136,60 214,60 230,76 230,190 136,190" fill="#C8DDEF" fill-opacity="0.75" stroke="#0072C6" stroke-width="3"/>
  <!-- Dog-ear fold -->
  <polygon points="214,60 230,76 214,76" fill="#A0BEDB"/>

  <!-- Code lines inside output document -->
  <line x1="152" y1="91"  x2="210" y2="91"  stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
  <line x1="152" y1="111" x2="192" y2="111" stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
  <line x1="152" y1="131" x2="202" y2="131" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="152" y1="151" x2="185" y2="151" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <line x1="152" y1="171" x2="172" y2="171" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- ScriptBuilder label -->
  <text x="24" y="226" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700"
        fill="#C8DDEF" opacity="0.7" text-anchor="start" textLength="206" lengthAdjust="spacing">ScriptBuilder</text>

</svg>
