<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="outer-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#011c3d"/>
      <stop offset="100%" stop-color="#000f22"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Dark background covers the GitLab rounded corner crop -->
  <rect width="192" height="192" fill="url(#outer-bg)"/>

  <!-- Terminal window frame -->
  <rect x="10" y="10" width="172" height="172" fill="url(#bg)" stroke="#0D5AA7" stroke-width="6"/>

  <!-- PS> prompt — top-left inside window -->
  <text x="20" y="41" font-family="'Consolas','Courier New',monospace" font-size="28"
        fill="#1577C0" opacity="0.9">PS&gt;</text>

  <!-- Script -->
  <text x="96" y="114" text-anchor="middle"
        font-family="'Consolas','Courier New',monospace" font-size="36" font-weight="700"
        fill="#5DB8F5">Script</text>

  <!-- Builder -->
  <text x="96" y="157" text-anchor="middle"
        font-family="'Consolas','Courier New',monospace" font-size="36" font-weight="700"
        fill="#FFFFFF">Builder</text>

</svg>
