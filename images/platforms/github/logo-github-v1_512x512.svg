<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="outer-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#011c3d"/>
      <stop offset="100%" stop-color="#000f22"/>
    </linearGradient>
    <linearGradient id="win-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Dark background fills the GitHub circle crop -->
  <rect width="500" height="500" fill="url(#outer-bg)"/>

  <!-- Square logo centered: 300x300 at x=100, y=100 -->
  <!-- Corners at distance ~212px from center < 245px radius, no clipping -->
  <svg x="100" y="100" width="300" height="300" viewBox="0 0 256 256">
    <rect x="5" y="5" width="246" height="246" fill="url(#win-bg)" stroke="#0D5AA7" stroke-width="10"/>
    <text x="18" y="52" font-family="'Consolas', 'Courier New', monospace" font-size="42"
          fill="#2B87D3" opacity="0.85">PS&gt;</text>
    <text x="128" y="128" font-family="'Consolas', 'Courier New', monospace" font-size="104"
          font-weight="700" fill="#C8DDEF" text-anchor="middle" dy="0.35em">SB</text>
  </svg>
</svg>
