<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Terminal window frame -->
  <rect x="4" y="4" width="248" height="248" fill="url(#bg)" stroke="#0D5AA7" stroke-width="8"/>

  <!-- PS> prompt — top-left inside window -->
  <text x="18" y="48" font-family="'Consolas','Courier New',monospace" font-size="40"
        fill="#1577C0" opacity="0.9">PS&gt;</text>

  <!-- Script -->
  <text x="128" y="154" text-anchor="middle"
        font-family="'Consolas','Courier New',monospace" font-size="52" font-weight="700"
        fill="#5DB8F5">Script</text>

  <!-- Builder -->
  <text x="128" y="216" text-anchor="middle"
        font-family="'Consolas','Courier New',monospace" font-size="52" font-weight="700"
        fill="#FFFFFF">Builder</text>

</svg>
