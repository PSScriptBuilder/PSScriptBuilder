<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001333"/>
    </linearGradient>
    <linearGradient id="separator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D5AA7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0D5AA7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D5AA7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D5AA7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0D5AA7" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0D5AA7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D5AA7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot grid texture -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#0D5AA7" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- === LEFT COLUMN === -->

  <!-- Icon 160x160 at (80, 70) — icon-v1 elements scaled 256→160 (factor 0.625) -->
  <g transform="translate(80,70) scale(0.625)">
    <!-- Terminal window frame -->
    <rect x="5" y="5" width="246" height="246" fill="url(#icon-bg)" stroke="#0D5AA7" stroke-width="8"/>

    <!-- PS> prompt -->
    <text x="18" y="48" font-family="'Consolas','Courier New',monospace" font-size="40"
          fill="#1577C0" opacity="0.9">PS&gt;</text>

    <!-- Source document stack (left) -->
    <rect x="24" y="115" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.22"/>
    <rect x="34" y="125" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.45"/>
    <polygon points="44,135 104,135 116,147 116,231 44,231" fill="#6E9DBF"/>
    <polygon points="104,135 116,147 104,147" fill="#4E85AB"/>
    <line x1="54" y1="163" x2="106" y2="163" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
    <line x1="54" y1="181" x2="92"  y2="181" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
    <line x1="54" y1="199" x2="100" y2="199" stroke="#0072C6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Output document — dog-ear -->
    <polygon points="136,101 214,101 230,117 230,231 136,231" fill="#C8DDEF" fill-opacity="0.75" stroke="#0072C6" stroke-width="3"/>
    <polygon points="214,101 230,117 214,117" fill="#A0BEDB"/>
    <line x1="152" y1="132" x2="210" y2="132" stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="152" x2="192" y2="152" stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="172" x2="202" y2="172" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="152" y1="192" x2="185" y2="192" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <line x1="152" y1="212" x2="172" y2="212" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Title -->
  <text x="274" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="1">PSScriptBuilder</text>

  <!-- Tagline -->
  <text x="276" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#DCDCAA">Script building, evolved.</text>

  <!-- Separator line -->
  <rect x="80" y="267" width="700" height="1" fill="#0D5AA7" opacity="0.35" rx="1"/>

  <!-- Subtitle -->
  <text x="80" y="327" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700" fill="#5DB8F5">Dependency-Aware PowerShell ScriptBuilder</text>

  <!-- Description -->
  <text x="80" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#a0aab4">Compile multi-file PowerShell projects into a single, deployable script &#x2014;</text>
  <text x="80" y="409" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#a0aab4">with AST-based dependency analysis, cycle detection, topological sorting,</text>
  <text x="80" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#a0aab4">a template engine, and built-in release management.</text>

  <!-- Tagline -->
  <text x="80" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#DCDCAA">Many files. One Script. Done.</text>

  <!-- Footer -->
  <line x1="80" y1="531" x2="1120" y2="531" stroke="#1A6FBF" stroke-width="1" opacity="0.35"/>
  <text x="80"   y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#3A96DD" font-weight="600">psscriptbuilder.com</text>
  <text x="1120" y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#6a8fa8" text-anchor="end">github.com/PSScriptBuilder &#xB7; PSGallery &#xB7; MIT License</text>

  <!-- === VERTICAL DIVIDER === -->
  <line x1="830" y1="55" x2="830" y2="510" stroke="#1A6FBF" stroke-width="1" opacity="0.35"/>

  <!-- === RIGHT COLUMN — Feature list === -->
  <!-- Header -->
  <text x="877" y="125" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#6a8fa8" letter-spacing="2">FEATURES</text>

  <!-- Feature items -->
  <circle cx="889" cy="170" r="5" fill="#3A96DD"/>
  <text x="905" y="175" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">AST Analysis</text>

  <circle cx="889" cy="215" r="5" fill="#3A96DD"/>
  <text x="905" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Dependency Resolution</text>

  <circle cx="889" cy="260" r="5" fill="#3A96DD"/>
  <text x="905" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Topological Sort</text>

  <circle cx="889" cy="305" r="5" fill="#3A96DD"/>
  <text x="905" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Cycle Detection</text>

  <circle cx="889" cy="350" r="5" fill="#3A96DD"/>
  <text x="905" y="355" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Configurable Collectors</text>

  <circle cx="889" cy="395" r="5" fill="#3A96DD"/>
  <text x="905" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Template Engine</text>

  <circle cx="889" cy="440" r="5" fill="#3A96DD"/>
  <text x="905" y="445" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">Release Management</text>

  <circle cx="889" cy="485" r="5" fill="#3A96DD"/>
  <text x="905" y="490" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#9FB8CC">PS 5.1 Compatible</text>

</svg>
