<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="win-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Terminal window outer frame + body -->
  <rect x="5" y="5" width="246" height="246" fill="url(#win-bg)" stroke="#0D5AA7" stroke-width="10"/>

  <!-- PS> prompt — prominent, top-left -->
  <text x="18" y="52" font-family="'Consolas', 'Courier New', monospace" font-size="42"
        fill="#1577C0" opacity="0.85">PS&gt;</text>

  <!-- SB monogram — dominant -->
  <text x="128" y="128" font-family="'Consolas', 'Courier New', monospace" font-size="104"
        font-weight="700" fill="#C8DDEF" text-anchor="middle" dy="0.35em">SB</text>
</svg>
