<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001333"/>
    </linearGradient>
    <linearGradient id="separator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D5AA7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0D5AA7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D5AA7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot grid texture -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#0D5AA7" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- === CONTENT === -->

  <!-- Icon 160x160 at (80, 70) — icon-v1 elements scaled 256→160 (factor 0.625) -->
  <g transform="translate(80,70) scale(0.625)">
    <!-- Terminal window frame -->
    <rect x="5" y="5" width="246" height="246" fill="url(#icon-bg)" stroke="#0D5AA7" stroke-width="8"/>

    <!-- PS> prompt -->
    <text x="18" y="48" font-family="'Consolas','Courier New',monospace" font-size="40"
          fill="#1577C0" opacity="0.9">PS&gt;</text>

    <!-- Source document stack (left) -->
    <!-- Back doc -->
    <rect x="24" y="115" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.22"/>
    <!-- Mid doc -->
    <rect x="34" y="125" width="72" height="96" rx="6" fill="#00A4EF" opacity="0.45"/>
    <!-- Front doc with dog-ear -->
    <polygon points="44,135 104,135 116,147 116,231 44,231" fill="#6E9DBF"/>
    <polygon points="104,135 116,147 104,147" fill="#4E85AB"/>
    <!-- Lines on front doc -->
    <line x1="54" y1="163" x2="106" y2="163" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
    <line x1="54" y1="181" x2="92"  y2="181" stroke="#0072C6" stroke-width="5" stroke-linecap="round"/>
    <line x1="54" y1="199" x2="100" y2="199" stroke="#0072C6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Output document — dog-ear -->
    <polygon points="136,101 214,101 230,117 230,231 136,231" fill="#C8DDEF" fill-opacity="0.75" stroke="#0072C6" stroke-width="3"/>
    <!-- Dog-ear fold -->
    <polygon points="214,101 230,117 214,117" fill="#A0BEDB"/>
    <!-- Code lines inside output document -->
    <line x1="152" y1="132" x2="210" y2="132" stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="152" x2="192" y2="152" stroke="#0072C6" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="172" x2="202" y2="172" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="152" y1="192" x2="185" y2="192" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <line x1="152" y1="212" x2="172" y2="212" stroke="#0072C6" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Title + Tagline block — visually centered on logo midpoint (y=150) -->
  <text x="276" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="90" font-weight="700" fill="#ffffff" letter-spacing="1.5">PSScriptBuilder</text>

  <!-- Tagline -->
  <text x="278" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="36" fill="#DCDCAA">Script building, evolved.</text>

  <!-- Separator line -->
  <rect x="80" y="266" width="900" height="3" fill="url(#separator)" rx="1"/>

  <!-- Subtitle -->
  <text x="80" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="600" fill="#3A96DD">Dependency-Aware Script Builder for PowerShell</text>

  <!-- Description -->
  <text x="80" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="28" fill="#a0aab4">Build single, deployable scripts from multi-file PowerShell projects &#x2013;&#x2013;</text>
  <text x="80" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="28" fill="#a0aab4">with automatic dependency resolution and topological sorting.</text>

  <!-- Feature badges — 4 pills -->
  <rect x="80"  y="468" width="192" height="30" rx="4" fill="#1B3A5C" stroke="none"/>
  <text x="176" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#C8DDEF" text-anchor="middle">PS 5.1 Compatible</text>

  <rect x="288" y="468" width="219" height="30" rx="4" fill="#1B3A5C" stroke="none"/>
  <text x="397" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#C8DDEF" text-anchor="middle">Dependency Resolution</text>

  <rect x="523" y="468" width="178" height="30" rx="4" fill="#1B3A5C" stroke="none"/>
  <text x="612" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#C8DDEF" text-anchor="middle">Topological Sort</text>

  <rect x="717" y="468" width="196" height="30" rx="4" fill="#1B3A5C" stroke="none"/>
  <text x="815" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#C8DDEF" text-anchor="middle">Release Management</text>

  <!-- Footer -->
  <line x1="80" y1="528" x2="1120" y2="528" stroke="#0D3670" stroke-width="1.5"/>
  <text x="80"   y="556" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#3A96DD" font-weight="600">psscriptbuilder.com</text>
  <text x="1120" y="556" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#6a8fa8" text-anchor="end">MIT License &#xB7; Available on PSGallery &#xB7; github.com/PSScriptBuilder</text>

</svg>
